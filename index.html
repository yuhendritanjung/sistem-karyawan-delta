<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Karyawan Delta</title>
    
    <!-- 1. PEMANGGILAN LIBRARY FIREBASE ONLINE RESMI (Wajib agar Web Tidak Blank/Kosong) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>


    <!-- 2. DESAIN TAMPILAN (CSS) Halaman Login Biru Modern -->
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
        }
        h3 {
            color: #666;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 18px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.2);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background: #0056b3;
        }
        .error-message {
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

<!-- 3. STRUKTUR HALAMAN UTAMA (HTML) -->
<div class="login-container">
    <h2>Sistem Informasi Karyawan Delta</h2>
    <h3>Login Karyawan</h3>
    
    <form id="loginForm">
        <div class="input-group">
            <label for="username">ID Karyawan</label>
            <input type="text" id="username" placeholder="Masukkan nama ID Anda (contoh: jojoanugrah)" required autocomplete="username">
        </div>
        <div class="input-group">
            <label for="password">Kata Sandi</label>
            <input type="password" id="password" placeholder="Masukkan Password Anda" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit">Masuk</button>
    </form>

    <!-- Tempat memunculkan pesan merah jika login gagal -->
    <div id="error-message" class="error-message"></div>
</div>

<!-- 4. LOGIKA JAVASCRIPT & LOG LOGIN FIREBASE -->
<script>
    // KONFIGURASI PROYEK FIREBASE ANDA 
    // (Jika ada data apiKey atau appId baru di Firebase Anda, silakan sesuaikan isinya)
    const firebaseConfig = {
        apiKey: "AIzaSy...", 
        authDomain: "://firebaseapp.com",
        projectId: "chemis-delta",
        storageBucket: "://appspot.com",
        messagingSenderId: "xxxxxxxxx",
        appId: "1:xxxxxxxxx:web:xxxxxxxxx"
    };

    // Inisialisasi Firebase secara aman
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    // Menangani aksi klik tombol Masuk
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Mencegah halaman muat ulang (reload) otomatis

        let userInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');

        // Sembunyikan pesan eror yang lama setiap tombol diklik ulang
        errorDiv.style.display = 'none';

        // OTOMATISASI DOMAIN: Jika karyawan tidak mengetik '@', sistem otomatis menambahkan domain perusahaan Anda
        let formattedEmail = userInput;
        if (!userInput.includes('@')) {
            formattedEmail = userInput + "@rayon1.com";
        }

        // Proses Otentikasi langsung ke server Firebase Auth
        firebase.auth().signInWithEmailAndPassword(formattedEmail, passwordInput)
            .then((userCredential) => {
                // JIKA LOGIN BERHASIL: Muncul notifikasi lalu arahkan ke Google Sheets Anda
                alert("Login Berhasil! Selamat bekerja.");
                
                // === SILAKAN GANTI LINK DI BAWAH INI DENGAN LINK GOOGLE SHEETS ABSENSI ANDA YANG ASLI ===
                window.location.href = "https://docs.google.com/spreadsheets/d/13LOxjXsBtLFwIvIU4b8btCa2Xnr-nfov86aEz-6lnHo/edit?usp=sharing"; 
            })
            .catch((error) => {
                // JIKA LOGIN GAGAL (Akun salah / password salah / tidak ada internet)
                console.error("Firebase Auth Error: ", error.code, error.message);
                errorDiv.innerText = "❌ ID Karyawan atau Password Salah!";
                errorDiv.style.display = 'block';
            });
    });
</script>

</body>
</html>
