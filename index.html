<!-- Pastikan CDN Firebase ini ada di bagian atas kode Anda -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
    // 1. ISI DENGAN KONFIGURASI FIREBASE MILIK ANDA
    const firebaseConfig = {
        apiKey: "AIzaSy...", 
        authDomain: "://firebaseapp.com",
        projectId: "chemis-delta",
        storageBucket: "://appspot.com",
        messagingSenderId: "xxxxxxxxx",
        appId: "1:xxxxxxxxx:web:xxxxxxxxx"
    };

    // Inisialisasi Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    // 2. LOGIKA PROSES LOGIN RESMI FIREBASE
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Mencegah halaman reload otomatis

        let userInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');

        if(errorDiv) errorDiv.style.display = 'none';

        // OTOMATISASI EMAIL: Jika user hanya mengetik 'jojoanugrah' atau 'delta', 
        // sistem akan otomatis menambahkan '@rayon1.com' di latar belakang
        let formattedEmail = userInput;
        if (!userInput.includes('@')) {
            formattedEmail = userInput + "@rayon1.com";
        }

        // Memanggil fungsi Firebase Auth untuk memeriksa akun ke server Cloud
        firebase.auth().signInWithEmailAndPassword(formattedEmail, passwordInput)
            .then((userCredential) => {
                // JIKA AKUN COCOK DI FIREBASE AUTH -> Alihkan ke Google Sheets
                alert("Login Berhasil! Selamat bekerja.");
                window.location.href = "https://docs.google.com/spreadsheets/d/13LOxjXsBtLFwIvIU4b8btCa2Xnr-nfov86aEz-6lnHo/edit?usp=sharing"; // GANTI DENGAN LINK GOOGLE SHEETS ANDA
            })
            .catch((error) => {
                // JIKA AKUN TIDAK COCOK ATAU BELUM TERDAFTAR DI AUTH
                console.error("Firebase Error: ", error.message);
                if(errorDiv) {
                    errorDiv.innerText = "❌ ID Karyawan atau Password Salah!";
                    errorDiv.style.display = 'block';
                } else {
                    alert("ID Karyawan atau Password Salah!");
                }
            });
    });
</script>
